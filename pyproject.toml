[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beat-engine"
version = "0.3.0+ti1"
description = "BEAT numerical engine and versioned worker client for electroacoustics"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.15,<0.16", "build"]

[project.scripts]
beat-engine = "beat_engine.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beat_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
